services:
  # Backend Service
  - type: web
    name: klbsmtp-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: QUEUE_MODE
        value: inline
      - key: CONVEX_URL
        sync: false # You will enter your Convex URL in the Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false # You will enter this in the Render dashboard
      - key: SMTP_PASS
        sync: false # You will enter this in the Render dashboard

  # Frontend Service (Client)
  - type: web
    name: klbsmtp-frontend
    env: node
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          name: klbsmtp-backend
          type: web
          property: host
        value: https://${host}/api/v1
